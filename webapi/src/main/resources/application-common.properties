spring.main.banner-mode=off

# disable TLS
server.port=${BELAYER_SERVER_PORT:8000}
server.ssl.enabled=false
# enable TLS
#server.port=${BELAYER_SERVER_PORT:8443}
#server.ssl.enabled=true
#server.ssl.protocol=TLSv1.2
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=classpath:server-cert.p12
#server.ssl.key-store-password=
# The management port is open unless this is false. It serves only the
# endpoints listed in belayer.management.exposure: health and prometheus by
# default. Others (info, env, beans, openapi, swagger-ui) can be added through
# BELAYER_MANAGEMENT_EXPOSURE when needed; they are not for production use.
# See ManagementPortEnvironmentPostProcessor.
belayer.management.enabled=${BELAYER_MANAGEMENT_ENABLED:true}
belayer.management.exposure=${BELAYER_MANAGEMENT_EXPOSURE:health,prometheus}
management.server.port=${BELAYER_MANAGEMENT_PORT:18000}
management.server.ssl.enabled=false

belayer.adminpage.enable=${BELAYER_ADMIN_PAGE_ENABLED:false}
belayer.adminpage.path=${BELAYER_ADMIN_PAGE_PATH:/admin}
spring.webflux.static-path-pattern=${belayer.adminpage.path}/**
spring.web.resources.static-locations=${BELAYER_WEBADMIN_LOCATION:file://dev/null}

# openapi
springdoc.show-actuator=true
springdoc.use-management-port=true

# actuator
management.endpoints.web.base-path=/management
management.endpoints.jmx.exposure.exclude=*
management.endpoints.jmx.exposure.include=
management.endpoints.web.exposure.exclude=shutdown
management.endpoints.web.exposure.include=${belayer.management.exposure}

# devtools
spring.devtools.remote.restart.enabled=true
spring.devtools.livereload.enabled=true

# web-server
server.jetty.accesslog.enabled=${BELAYER_ACCESS_LOG_ENABLED:false}
# Behind a reverse proxy, set "framework" to take the URL the client requested
# from the X-Forwarded-* (or Forwarded) headers the proxy adds, instead of the
# Host the proxy sends. Leave "none" when clients reach this server directly:
# they could then send these headers themselves.
server.forward-headers-strategy=${BELAYER_FORWARD_HEADERS_STRATEGY:none}

# log 
logging.level.root=${BELAYER_LOG_LEVEL:WARN}
logging.level.com.tsurugidb=${BELAYER_LOG_LEVEL:DEBUG}
logging.level.com.tsurugidb.belayer.webapi.security.handler=${BELAYER_AUTH_ERROR_LOG_LEVEL:ERROR}
logging.level.com.tsurugidb.belayer.webapi.api.AuthHandler=${BELAYER_AUTH_ERROR_LOG_LEVEL:ERROR}
logging.level.org.springframework=${BELAYER_LOG_LEVEL:INFO}

# app
webapi.required.java_major_version=${BELAYER_REQUIRED_JAVA_MAJOR_VERSION:11}
webapi.application.name=belayer-webapi
webapi.belayer.home=${BELAYER_HOME:/usr/lib/tsurugi-belayer}
webapi.config.root=${BELAYER_CONFIG_ROOT:${webapi.belayer.home}/config}
webapi.config.allowed_origins=${BELAYER_ALLOWED_ORIGINS:}
webapi.config.allowed_methods=${BELAYER_ALLOWED_METHODS:}
webapi.config.allowed_headers=${BELAYER_ALLOWED_HEADERS:}
webapi.config.allow_credentials=${BELAYER_ALLOW_CREDENTIALS:false}
webapi.storage.root=${BELAYER_STORAGE_ROOT:/opt/belayer/storage}
webapi.tsurugi.url=${TSURUGI_URL:ipc:tsurugi}
webapi.tsurugi.connect_timeout=${TSURUGI_CONNECT_TIMEOUT_SEC:5}
webapi.tsurugi.session_timeout=${TSURUGI_SESSION_TIMEOUT_MIN:15}
webapi.tsurugi.home=${TSURUGI_HOME:/usr/lib/tsurugi}
webapi.tsurugi.conf=${TSURUGI_CONF:${webapi.tsurugi.home}/var/etc/tsurugi.ini}
webapi.tsurugi.supported.modes=standalone
webapi.auth.url=${TSURUGI_AUTH_URL:http://localhost:8080/harinoki}
webapi.auth.at.expiration.min=${TSURUGI_AUTH_AT_EXPIRATION_MIN:10}
webapi.auth.verify.cache.max.min=${TSURUGI_AUTH_VERIFY_CACHE_MAX_MIN:30}
webapi.auth.verify.timeout.ms=${TSURUGI_AUTH_VERIFY_TIMEOUT_MS:1000}
webapi.user_role.data.directory=${webapi.storage.root}
webapi.user_role.default.mapping=${BELAYER_DEFAULT_ROLE_USER_MAPPING:{"ROLE_ADMIN": [".*"]}}
webapi.job.data.directory=${webapi.storage.root}
webapi.job.data.expiration.days=${BELAYER_JOB_EXPIRATION_DAYS:3}
# zip compress level(0-9 or -1 as default)
webapi.download.zipcompresslevel=${BELAYER_DL_ZIP_COMPRESS_LEVEL:-1}
webapi.backup.zipcompresslevel=${BELAYER_BK_ZIP_COMPRESS_LEVEL:-1}
webapi.backup.progress_percentage_api_return=50
webapi.backup.progress_percentage_filesize_sum_computed=60
webapi.dump.progress_percentage_api_return=50
webapi.dump.progress_percentage_filesize_sum_computed=60
webapi.load.progress_percentage_filesize_sum_computed=60
webapi.list.max.files=${BELAYER_MAX_FILE_LIST_SIZE:500}
webapi.cli.timeout=1
webapi.cli.cmd.scriptdir=${webapi.belayer.home}/proc
webapi.cli.cmd.tgctl_command=${TSURUGI_TGCTL_COMMAND:${webapi.tsurugi.home}/bin/tgctl_w}
webapi.cli.cmd.tgha_command=${TSURUGI_TGHA_COMMAND:${webapi.tsurugi.home}/bin/tgha_w}
# The command lines below are split into arguments at whitespace before the %s
# placeholders are filled, and the command is started without a shell, so a
# value always stays one argument and nothing in it is interpreted. Do not quote
# the placeholders. The authentication token is not on the command line: the
# commands take it from the environment variable TSURUGI_AUTH_TOKEN.
webapi.cli.cmd.start=${webapi.cli.cmd.tgctl_command} start --monitor %s --conf %s --timeout ${webapi.cli.timeout} --mode %s
webapi.cli.cmd.db-changemode=${webapi.cli.cmd.tgha_command} mode switch %s --monitor %s --conf %s --timeout ${webapi.cli.timeout}
webapi.cli.cmd.dbsync=${webapi.cli.cmd.tgha_command} database apply --monitor %s --conf %s --from %s --auto
webapi.cli.cmd.shutdown=${webapi.cli.cmd.tgctl_command} shutdown --monitor %s --conf %s --timeout ${webapi.cli.timeout}
webapi.cli.cmd.db-status=${webapi.cli.cmd.scriptdir}/show_db_status.sh %s %s %s %s
webapi.cli.cmd.quiesce=${webapi.cli.cmd.tgctl_command} quiesce --monitor %s --conf %s --label %s
webapi.cli.cmd.backupoffline=${webapi.cli.cmd.tgctl_command} backup create %s --monitor %s --conf %s --force
webapi.cli.cmd.restore=${webapi.cli.cmd.tgctl_command} restore backup %s --monitor %s --conf %s --force
webapi.cli.cmd.session-status=${webapi.cli.cmd.tgctl_command} session show :%s --monitor %s --conf %s
webapi.cli.cmd.session-set-var=${webapi.cli.cmd.tgctl_command} session set :%s %s %s --monitor %s --conf %s
webapi.cli.cmd.session-kill=${webapi.cli.cmd.tgctl_command} session shutdown :%s --monitor %s --conf %s