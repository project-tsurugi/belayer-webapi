plugins {
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
	id 'com.github.jk1.dependency-license-report' version '2.0'
}

group = 'com.tsurugidb.belayer'
def versionString = file('../VERSION').text.trim()
version = versionString
def tsubarkuro_version = '1.16.0'

def resolvedTsubakuroVersion = project.hasProperty('com.tsurugidb.tsubakuro.version')
	? project.getProperty('com.tsurugidb.tsubakuro.version')
	: tsubarkuro_version

ext {
	isReleaseVersion = !version.endsWith("SNAPSHOT")
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

    all*.exclude module: 'spring-boot-starter-logging'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

// The toolchain is the JDK this is built with; the release is what the
// result has to run on. Tsurugi supports Java 11 through 17 at run time, so
// the bytecode targets 11 while the build itself uses 17 - the same split
// tsubakuro makes in buildSrc/src/main/groovy/tsubakuro.java-base.gradle.
//
// options.release rather than sourceCompatibility: it points the compiler at
// the Java 11 API as well as the Java 11 language level, so a method added
// after 11 fails to compile here instead of throwing NoSuchMethodError on a
// Java 11 runtime.
tasks.withType(JavaCompile) {
    options.release = 11
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
}

if (hasProperty('mavenLocal')) {
	repositories {
		mavenLocal()
	}
} else {
	repositories {
		maven {
			url 'https://central.sonatype.com/repository/maven-snapshots/'
			content {
				includeGroupByRegex 'com\\.tsurugidb.*'
			}
		}
	}
}
repositories {
	mavenCentral()
}

configurations.all {
	resolutionStrategy.cacheChangingModulesFor 8, 'hours'
}

sourceSets {
    main {
        java {
		    include 'com/tsurugidb/**'
 		    include 'org/apache/commons/csv/**'
		}
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-webflux-ui:1.8.0'
	implementation 'ch.qos.logback:logback-classic:1.2.13'
	implementation 'ch.qos.logback:logback-core:1.2.13'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.20'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.1'
	implementation 'org.apache.parquet:parquet-hadoop:1.16.0'
	implementation 'org.apache.hadoop:hadoop-common:3.4.2'
	implementation 'org.apache.hadoop:hadoop-client:3.4.2'
	implementation 'org.apache.commons:commons-csv:1.9.0'
	implementation "com.tsurugidb.tsubakuro:tsubakuro-session:${resolvedTsubakuroVersion}"
	implementation "com.tsurugidb.tsubakuro:tsubakuro-connector:${resolvedTsubakuroVersion}"
	implementation "com.tsurugidb.tsubakuro:tsubakuro-auth-http:${resolvedTsubakuroVersion}"
	implementation "com.tsurugidb.tsubakuro:tsubakuro-auth-mock:${resolvedTsubakuroVersion}"
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
	enabled = false
}

bootJar {
	archiveFileName = 'tsurugi-belayer.jar'
    launchScript()
	// read by OpenApiConfig as the version of the API document
	manifest {
		attributes 'Implementation-Version': project.version
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
test {
	finalizedBy jacocoTestReport // report is always generated after tests run
}
jacocoTestReport {
	dependsOn test // tests are required to run before generating the report
}

task showTsubakuroManifest {
	doLast {
		def tsubakuroJar = configurations["compileClasspath"].filter {
			it.name.startsWith("tsubakuro-session")
		}
		def version = resources.text.fromArchiveEntry(tsubakuroJar, "META-INF/MANIFEST.MF")
		print(version.asString())
	}
}
