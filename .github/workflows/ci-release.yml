name: Belayer-WebAPI-Release

on:
  push:
    tags-ignore:
      - '*-alpha'
  workflow_dispatch:

jobs:
  Build_Release_Archive:
    runs-on: [self-hosted, docker]
    timeout-minutes: 30
    container:
      image: ghcr.io/project-tsurugi/tsurugi-ci:ubuntu-22.04
      volumes:
        - ${{ vars.gradle_cache_dir }}:/root/.gradle
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup_Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create_Archives
        run: |
          VERSION=$(echo ${{ github.ref }} | sed -e "s#refs/tags/##g")
          echo ${VERSION} > ./VERSION
          cd distribution
          rm -fr dist
          sh create_archives.sh

      - name: Upload_Artifact
        uses: actions/upload-artifact@v7
        with:
          name: belayer-webapi-dists
          path: distribution/dist/*
          retention-days: 1

  Generate_GitHub_Release:
    needs: Build_Release_Archive
    runs-on: [self-hosted, docker]
    permissions:
      contents: write
    timeout-minutes: 30
    container:
      image: ghcr.io/project-tsurugi/tsurugi-ci:ubuntu-22.04
      volumes:
        - ${{ vars.gradle_cache_dir }}:/root/.gradle
    defaults:
      run:
        shell: bash

    steps:
      - name: Clean
        run: |
          rm -fr work

      - name: Download_Artifact
        uses: actions/download-artifact@v8
        with:
          name: belayer-webapi-dists
          path: work

      - name: Create_Release
        run: |
          # Only the rolling SNAPSHOT tag is recreated; a pushed version tag must stay where it is.
          if [[ "${BELAYER_VERSION}" == "SNAPSHOT" ]]; then
            _DELETE_OPTION=--cleanup-tag
          fi
          # Tags such as 1.5.4-snapshot, 1.5.4-SNAPSHOT and 1.6.0-BETA1 are prereleases and never "Latest".
          _VERSION_LC="${BELAYER_VERSION,,}"
          if [[ "${BELAYER_VERSION}" == "SNAPSHOT" || "${_VERSION_LC}" =~ -snapshot$ || "${_VERSION_LC}" =~ -beta ]]; then
            _PRERELEASE_OPTION=--prerelease
            _LATEST_OPTION=--latest=false
          else
            _LATEST_OPTION=--latest
          fi
          set -x
          gh release delete ${BELAYER_VERSION} -y ${_DELETE_OPTION} --repo project-tsurugi/belayer-webapi || true
          gh release create ${BELAYER_VERSION} work/* --title ${BELAYER_VERSION} ${_PRERELEASE_OPTION} ${_LATEST_OPTION} --repo project-tsurugi/belayer-webapi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BELAYER_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || 'SNAPSHOT' }}

